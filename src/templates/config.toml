#================================================
# GLOBAL SETTINGS
#================================================

# DEFAULT PROFILE
# If no URL pattern matches, this profile will be used.
# If not set, Chrome's built-in default ("Default") is used.
# default_profile = "Default"  # Uncomment and change as needed

# CHROME/BROWSER PATH
# Specify a custom path to your browser executable.
# Comment out to use auto-detection (Chrome/Chromium only).
# Note: Vivaldi requires explicit path specification.
#
# Chrome Linux example:
# chrome_path = "/usr/bin/google-chrome-stable"
#
# Chrome macOS example:
# chrome_path = "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
#
# Chrome Windows example:
# chrome_path = "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
#
# Vivaldi examples (requires explicit path):
# chrome_path = "/usr/bin/vivaldi"  # Linux
# chrome_path = "/Applications/Vivaldi.app/Contents/MacOS/Vivaldi"  # macOS

#================================================
# PROFILE CONFIGURATIONS
#================================================
# Define which Chrome profile to use for which URLs

# PROFILE DIRECTORY TIPS:
# - Find your profile directories at:
#   Chrome - Linux: ~/.config/google-chrome/
#   Chrome - macOS: ~/Library/Application Support/Google/Chrome/
#   Chrome - Windows: %LOCALAPPDATA%\Google\Chrome\User Data\
#   Vivaldi - Linux: ~/.config/vivaldi/
#   Vivaldi - macOS: ~/Library/Application Support/Vivaldi/
#   Vivaldi - Windows: %LOCALAPPDATA%\Vivaldi\User Data\
# - Common values are "Default", "Profile 1", "Profile 2", etc.
# - Check chrome://version (or vivaldi://version) to see your current Profile Path

# Work profile example (using Chrome Beta)
[[profiles]]
name = "Work"
profile_directory = "Profile 1"
url_patterns = ["github.com", "work.example.com", "jira.mycompany.net"]
# Optional: Use a specific Chrome version for this profile
# chrome_path = "/usr/bin/google-chrome-beta"  # Linux example
# chrome_path = "/Applications/Google Chrome Beta.app/Contents/MacOS/Google Chrome Beta"  # macOS example

# Personal profile example (using stable Chrome)
# [[profiles]]
# name = "Shopping"
# profile_directory = "Profile 2"
# url_patterns = ["amazon.com", "ebay.com"]
# chrome_path = "/usr/bin/google-chrome-stable"  # Uses stable Chrome for shopping
